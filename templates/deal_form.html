{% extends "base.html" %}
{% block body %}
<div class="top"><h2>{{ 'Edit deal' if d else 'New deal' }}</h2></div>
<form method="post" class="card form-grid">
  <div><label>Borrower</label>
    <select name="borrower_id" required>
      {% for b in borrowers %}
      <option value="{{ b.id }}" {% if selected_borrower==b.id or (d and d.borrower_id==b.id) %}selected{% endif %}>{{ b.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div><label>Loan type</label>
    <select name="loan_type">
      {% for t in ['Hard Money','Bridge','Fix and Flip','Transactional Loan'] %}
      <option value="{{ t }}" {% if d and d.loan_type==t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    <p class="hint">Transactional Loan: 3% flat fee for up to 7 days. Extensions after 7 days are negotiable.</p>
  </div>
  <div class="span-2"><label>Property address</label><input name="address" value="{{ d.address if d else '' }}" required></div>
  <div><label>Purchase price</label><input name="purchase_price" type="number" step="0.01" value="{{ d.purchase_price if d else '' }}"></div>
  <div><label>Current value / as-is</label><input name="as_is_value" type="number" step="0.01" value="{{ d.as_is_value if d else '' }}"></div>
  <div><label>ARV</label><input name="arv" type="number" step="0.01" value="{{ d.arv if d else '' }}"></div>
  <div><label>Rehab budget</label><input name="rehab_budget" type="number" step="0.01" value="{{ d.rehab_budget if d else '' }}"></div>
  <div><label>Requested loan amount</label><input name="loan_amount" type="number" step="0.01" value="{{ d.loan_amount if d else '' }}"></div>
  <div><label>Rate (%)</label><input name="rate" type="number" step="0.01" value="{{ d.rate if d else '' }}"></div>
  <div><label>Points</label><input name="points" type="number" step="0.01" value="{{ d.points if d else '' }}"></div>
  <div><label>Term (months)</label><input name="term_months" type="number" value="{{ d.term_months if d else 12 }}"></div>
  <div><label>Status</label>
    <select name="status">
      {% for s in ['Lead','Application','Underwriting','Approved','Conditions','Closing','Funded','Declined','Paid Off'] %}
      <option value="{{ s }}" {% if d and d.status==s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="span-2"><label>Exit strategy</label><input name="exit_strategy" value="{{ d.exit_strategy if d else '' }}"></div>
  <div class="span-2"><label>Market / property notes</label><textarea name="notes">{{ d.notes if d else '' }}</textarea></div>
  <div class="span-2"><label>Override LTV guideline? (reason required if LTV over 75%)</label>
    <textarea name="ltv_override_reason">{{ d.ltv_override_reason if d else '' }}</textarea></div>
  <div class="span-2"><button class="btn" type="submit">Save and run underwriting</button></div>
</form>
{% endblock %}
