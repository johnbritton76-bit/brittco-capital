<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete your Brittco profile</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="main" style="max-width:900px;margin:0 auto">
  <div class="portal-head">
    <img class="logo" src="/static/logo.jpg" alt="Brittco Capital Inc">
    <div>
      <div class="tag">Borrower invite</div>
      <h2 style="margin:4px 0 0">Create your profile</h2>
    </div>
  </div>
  {% if error %}<p class="badge bad">{{ error }}</p>{% endif %}
  {% if inv and b %}
  <p class="hint">Required fields must be finished before you can submit a loan application.</p>
  <form method="post" class="card form-grid">
    {% include "_borrower_profile_fields.html" %}
    <div><label>Choose a portal password *</label><input name="password" type="password" required></div>
    <div class="span-2"><button class="btn" type="submit">Save profile and continue</button></div>
  </form>
  {% endif %}
</main>
</body>
</html>
