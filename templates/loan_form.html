{% extends "base.html" %}
{% block body %}
<div class="top"><h2>Enter current loan</h2></div>
<form method="post" class="card form-grid">
  <div><label>Borrower</label>
    <select name="borrower_id" required>
      {% for b in borrowers %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div><label>Related deal (optional)</label>
    <select name="deal_id">
      <option value="">None</option>
      {% for d in deals %}<option value="{{ d.id }}">#{{ d.id }} {{ d.address }}</option>{% endfor %}
    </select>
  </div>
  <div><label>Loan number</label><input name="loan_number" placeholder="BC-1002"></div>
  <div><label>Loan type</label>
    <select name="loan_type">
      <option>Hard Money</option><option>Bridge</option><option>Fix and Flip</option><option>Transactional Loan</option>
    </select>
  </div>
  <div class="span-2"><label>Property address</label><input name="property_address" required></div>
  <div><label>Original principal</label><input name="original_principal" type="number" step="0.01" required></div>
  <div><label>Current balance</label><input name="current_balance" type="number" step="0.01" placeholder="Same as principal if new"></div>
  <div><label>Rate (%)</label><input name="rate" type="number" step="0.01"></div>
  <div><label>Points</label><input name="points" type="number" step="0.01"></div>
  <div><label>Start date</label><input name="start_date" type="date"></div>
  <div><label>Maturity date</label><input name="maturity_date" type="date"></div>
  <div><label>Payment type</label>
    <select name="payment_type">
      <option>Interest only</option><option>Amortizing</option><option>Balloon</option>
    </select>
  </div>
  <div><label>Payment amount</label><input name="payment_amount" type="number" step="0.01"></div>
  <div><label>Frequency</label>
    <select name="payment_frequency"><option>Monthly</option><option>Interest due at maturity</option></select>
  </div>
  <div><label>Next payment due</label><input name="next_payment_due" type="date"></div>
  <div><label>Late fee</label><input name="late_fee" type="number" step="0.01"></div>
  <div><label>Status</label>
    <select name="status">
      <option>Current</option><option>Late</option><option>Default</option><option>Paid Off</option>
    </select>
  </div>
  <div class="span-2"><label>Notes</label><textarea name="notes"></textarea></div>
  <div class="span-2"><button class="btn" type="submit">Save loan</button></div>
</form>
{% endblock %}
